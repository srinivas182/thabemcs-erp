# Local development environment.
#   docker compose up -d
#   docker compose exec app composer setup
# App:        http://localhost:8080
# Mailpit:    http://localhost:8025
# Meilisearch http://localhost:7700

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on: [mysql, redis]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  # Workers are split by queue so a long report or integration run never delays user-facing work.
  # In production each of these is its own service (or Horizon supervisor) and scales independently.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --queue=default,mail --tries=3 --timeout=120 --max-jobs=500
    volumes:
      - .:/var/www/html
    depends_on: [app, redis]

  queue-metrics:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --queue=metrics --tries=3 --timeout=300 --max-jobs=500
    volumes:
      - .:/var/www/html
    depends_on: [app, redis]

  queue-maintenance:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --queue=maintenance,reports,integrations --tries=2 --timeout=900 --max-jobs=200
    volumes:
      - .:/var/www/html
    depends_on: [app, redis]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on: [app, redis]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: thabekhulu
      MYSQL_USER: thabekhulu
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql-data:
  meili-data:
