name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # lets CI post a failure report as a commit comment

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, static analysis, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_sqlite, zip, gd, exif
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.json', 'composer.lock') }}

      - name: Install dependencies
        run: |
          if [ -f composer.lock ]; then composer install --no-interaction --prefer-dist --no-progress
          else composer update --no-interaction --prefer-dist --no-progress; fi

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        shell: bash
        run: vendor/bin/pint --test 2>&1 | tee /tmp/ci-pint.txt; exit ${PIPESTATUS[0]}

      - name: Static analysis (Larastan level 8)
        if: success() || failure()
        shell: bash
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G 2>&1 | tee /tmp/ci-phpstan.txt; exit ${PIPESTATUS[0]}

      - name: Tests (Pest)
        if: success() || failure()
        shell: bash
        run: vendor/bin/pest 2>&1 | tee /tmp/ci-pest.txt; exit ${PIPESTATUS[0]}

      - name: Post failure report on the commit
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Backend CI failed"
            for f in /tmp/ci-pint.txt /tmp/ci-phpstan.txt /tmp/ci-pest.txt; do
              [ -f "$f" ] || continue
              echo; echo "#### $(basename "$f" .txt)"; echo '```'
              clean=$(sed 's/\x1b\[[0-9;]*m//g' "$f")
              if [ "$f" = /tmp/ci-pest.txt ]; then
                echo "$clean" | grep -v '^#[0-9]' | grep -A18 'FAILED' | head -c 16000
                echo "$clean" | tail -4
              else
                echo "$clean" | tail -c 12000
              fi
              echo '```'
            done
          } > /tmp/report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/report.md

  frontend:
    name: Frontend (type check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build --workspace site-app
